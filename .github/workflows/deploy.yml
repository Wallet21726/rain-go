name: Deploy rain-go

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Set game access token
        env:
          GAME_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          test -n "$GAME_ACCESS_TOKEN"
          printf '%s' "$GAME_ACCESS_TOKEN" | pnpm --filter @rain-go/worker exec wrangler secret put ACCESS_TOKEN
      - name: Deploy
        run: pnpm --filter @rain-go/worker exec wrangler deploy
